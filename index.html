<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dora Tay turns 28</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪩</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1a0b2e;
    --plum: #2e1250;
    --magenta: #ff2e93;
    --gold: #ffc83d;
    --cyan: #3df5ff;
    --silver: #e9e6f2;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at 50% 0%, var(--plum), var(--night) 70%) fixed;
    color: var(--silver);
    font-family: "Outfit", system-ui, sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 2rem 1.25rem 4rem;
    overflow: hidden;
  }
  .beams {
    position: absolute; inset: -50%;
    background: conic-gradient(from 0deg at 50% 50%,
      transparent 0 8%, rgba(255,46,147,.28) 10%, transparent 12% 28%,
      rgba(61,245,255,.24) 30%, transparent 32% 48%,
      rgba(255,200,61,.26) 50%, transparent 52% 68%,
      rgba(255,46,147,.22) 70%, transparent 72% 88%,
      rgba(61,245,255,.22) 90%, transparent 92%);
    animation: sweep 24s linear infinite;
    filter: blur(14px);
    pointer-events: none;
  }
  @keyframes sweep { to { transform: rotate(360deg); } }

  .hero-inner { position: relative; z-index: 1; }
  .string {
    width: 2px; height: 14vh; margin: 0 auto;
    background: linear-gradient(var(--silver), #fff8);
  }
  .ball {
    width: clamp(150px, 34vw, 230px);
    aspect-ratio: 1;
    margin: 0 auto 1.5rem;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 32% 28%, #fff 0 4%, transparent 22%),
      repeating-linear-gradient(0deg, transparent 0 13px, rgba(10,0,25,.55) 13px 15px),
      repeating-linear-gradient(90deg, transparent 0 13px, rgba(10,0,25,.55) 13px 15px),
      radial-gradient(circle at 40% 35%, #f4f1fb, #9a93b3 60%, #4b4366);
    box-shadow:
      inset -22px -26px 40px rgba(20,0,45,.75),
      0 0 60px rgba(255,46,147,.55),
      0 0 120px rgba(61,245,255,.3);
    animation: bob 5s ease-in-out infinite;
  }
  .ball::after { /* colour glints drifting across the tiles to suggest spin */
    content: ""; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(90deg, transparent 0 28px, rgba(255,200,61,.45) 28px 30px, transparent 30px 58px, rgba(61,245,255,.4) 58px 60px),
      repeating-linear-gradient(0deg, transparent 0 41px, rgba(255,46,147,.35) 41px 43px);
    mix-blend-mode: screen;
    animation: spin 4s linear infinite;
  }
  @keyframes spin { to { background-position: 60px 0, 0 43px; } }
  @keyframes bob { 50% { transform: translateY(10px); } }

  h1 {
    margin: 0;
    font-family: "Monoton", "Outfit", sans-serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 11vw, 6.5rem);
    line-height: 1.05;
    letter-spacing: .02em;
    color: #fff;
    text-shadow: 0 0 6px var(--magenta), 0 0 22px var(--magenta), 0 0 60px var(--magenta);
    animation: flicker 6s infinite;
  }
  @keyframes flicker {
    0%, 92%, 96%, 100% { opacity: 1; }
    94% { opacity: .55; }
    98% { opacity: .8; }
  }
  .age {
    margin: .5rem 0 0;
    font-family: "Monoton", sans-serif;
    font-size: clamp(1.4rem, 5vw, 2.6rem);
    color: var(--gold);
    text-shadow: 0 0 14px rgba(255,200,61,.7);
  }
  .lede {
    max-width: 34rem; margin: 1.25rem auto 2rem; font-size: 1.15rem;
  }
  .btn {
    display: inline-block;
    font: inherit; font-weight: 600;
    padding: .8rem 1.6rem;
    border-radius: 999px;
    border: 2px solid var(--cyan);
    background: rgba(61,245,255,.08);
    color: var(--cyan);
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(61,245,255,.35);
    transition: background .2s, color .2s;
  }
  .btn:hover { background: var(--cyan); color: var(--night); }
  .btn:focus-visible, .thumb:focus-visible, .drop:focus-within { outline: 3px solid var(--gold); outline-offset: 3px; }

  /* ---------- Gallery ---------- */
  .gallery { max-width: 1100px; margin: 0 auto; padding: 4rem 1.25rem 6rem; }
  h2 {
    font-family: "Monoton", sans-serif; font-weight: 400;
    font-size: clamp(1.8rem, 6vw, 3rem); margin: 0 0 .5rem;
    color: var(--cyan); text-shadow: 0 0 16px rgba(61,245,255,.6);
  }
  .sub { margin: 0 0 1.75rem; max-width: 40rem; }
  .drop {
    display: block; text-align: center; cursor: pointer;
    padding: 2rem 1rem; margin-bottom: 2rem;
    border: 2px dashed var(--magenta); border-radius: 18px;
    background: rgba(255,46,147,.07);
    transition: background .2s;
  }
  .drop.over, .drop:hover { background: rgba(255,46,147,.18); }
  .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .drop strong { color: var(--gold); }
  .note { font-size: .9rem; opacity: .75; margin-top: .4rem; }

  .grid { columns: 3 220px; column-gap: 14px; }
  .item { position: relative; break-inside: avoid; margin: 0 0 14px; }
  .thumb {
    display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 0 2px rgba(255,255,255,.14), 0 8px 24px rgba(0,0,0,.4);
    transition: box-shadow .2s;
  }
  .thumb:hover { box-shadow: 0 0 0 2px var(--gold), 0 0 26px rgba(255,200,61,.55); }
  .thumb img { display: block; width: 100%; height: auto; }
  .del {
    position: absolute; top: 8px; right: 8px;
    width: 34px; height: 34px; border-radius: 50%;
    border: 0; background: rgba(26,11,46,.85); color: #fff; font-size: 1.2rem; cursor: pointer;
  }
  .del:hover { background: var(--magenta); }
  .empty { text-align: center; padding: 2rem 1rem; opacity: .85; }

  dialog {
    border: 0; padding: 0; background: transparent; max-width: 94vw; max-height: 94vh; overflow: visible;
  }
  dialog::backdrop { background: rgba(10,0,25,.92); }
  dialog img { max-width: 94vw; max-height: 86vh; border-radius: 10px; box-shadow: 0 0 60px rgba(255,46,147,.5); }
  dialog .btn { display: block; margin: 1rem auto 0; }

  footer { text-align: center; padding: 2rem 1rem 3rem; opacity: .75; }

  @media (prefers-reduced-motion: reduce) {
    .beams, .ball, .ball::after, h1 { animation: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="beams" aria-hidden="true"></div>
  <div class="hero-inner">
    <div class="string" aria-hidden="true"></div>
    <div class="ball" role="img" aria-label="Spinning mirror ball"></div>
    <h1>Dora Tay</h1>
    <p class="age">is 28</p>
    <p class="lede" id="lede">Twenty-eight years of sparkle. Put on your dancing shoes and add your favourite photos from the night.</p>
    <a class="btn" href="#gallery">Open the gallery</a>
  </div>
</header>

<main class="gallery" id="gallery">
  <h2>Gallery</h2>
  <p class="sub">Add photos from the party. Pick files or drop them below.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*" multiple>
    <strong>Add photos</strong> or drag them here
    <div class="note">Photos you add are saved in this browser only. To show them to everyone, put them in the <code>photos</code> folder of the repo and list them in <code>index.html</code>.</div>
  </label>

  <div class="grid" id="grid" aria-live="polite"></div>
  <p class="empty" id="empty" hidden>No photos yet. Be the first to add one.</p>
</main>

<footer>Happy birthday, Dora! 🪩</footer>

<dialog id="lightbox">
  <img id="big" alt="">
  <button class="btn" id="close" type="button">Close</button>
</dialog>

<script>
/* ===== Edit these ===== */
// Photos everyone can see: upload image files to the "photos" folder in your repo,
// then list the file names here, e.g. ["dora1.jpg", "party.png"]
const SHARED_PHOTOS = ["dora1.jpg","dora2.jpg","dora3.jpg","dora4.jpg","dora5.jpg","dora6.jpg","dora7.MOV","dora8.MOV",];
/* ======================= */

const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const fileInput = document.getElementById("file");
const drop = document.getElementById("drop");
const box = document.getElementById("lightbox");
const big = document.getElementById("big");

/* ---------- IndexedDB (per-browser storage for added photos) ---------- */
let dbPromise = null;
function openDB() {
  if (!dbPromise) {
    dbPromise = new Promise((resolve, reject) => {
      try {
        const req = indexedDB.open("dora-28-gallery", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      } catch (e) { reject(e); }
    });
  }
  return dbPromise;
}
async function dbDo(mode, fn) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("photos", mode);
    const req = fn(tx.objectStore("photos"));
    tx.oncomplete = () => resolve(req && req.result);
    tx.onerror = () => reject(tx.error);
  });
}
const getAll = () => dbDo("readonly", s => s.getAll());
const addPhoto = rec => dbDo("readwrite", s => s.add(rec));
const delPhoto = id => dbDo("readwrite", s => s.delete(id));

/* ---------- Resize before saving so storage stays small ---------- */
async function shrink(file, max = 1600) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale);
  c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
}

/* ---------- Render ---------- */
const urls = [];
function makeItem(src, onDelete) {
  const fig = document.createElement("figure");
  fig.className = "item";
  const b = document.createElement("button");
  b.className = "thumb"; b.type = "button"; b.setAttribute("aria-label", "View photo larger");
  const img = document.createElement("img");
  img.src = src; img.alt = "Party photo"; img.loading = "lazy";
  b.appendChild(img);
  b.addEventListener("click", () => { big.src = src; box.showModal(); });
  fig.appendChild(b);
  if (onDelete) {
    const d = document.createElement("button");
    d.className = "del"; d.type = "button"; d.textContent = "×";
    d.setAttribute("aria-label", "Remove photo");
    d.addEventListener("click", onDelete);
    fig.appendChild(d);
  }
  return fig;
}

async function render() {
  urls.splice(0).forEach(u => URL.revokeObjectURL(u));
  grid.replaceChildren();
  SHARED_PHOTOS.forEach(name => grid.appendChild(makeItem("photos/" + encodeURIComponent(name))));
  try {
    const local = await getAll();
    local.reverse().forEach(p => {
      const u = URL.createObjectURL(p.blob);
      urls.push(u);
      grid.appendChild(makeItem(u, async () => { await delPhoto(p.id); render(); }));
    });
  } catch (e) {
    console.warn("Saving photos in this browser isn’t available:", e);
  }
  empty.hidden = grid.children.length > 0;
}

async function handleFiles(files) {
  const imgs = [...files].filter(f => f.type.startsWith("image/"));
  for (const f of imgs) {
    try { await addPhoto({ blob: await shrink(f), name: f.name, added: Date.now() }); }
    catch (e) { console.warn("Couldn’t add", f.name, e); }
  }
  render();
}

fileInput.addEventListener("change", () => { handleFiles(fileInput.files); fileInput.value = ""; });
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => handleFiles(e.dataTransfer.files));

document.getElementById("close").addEventListener("click", () => box.close());
box.addEventListener("click", e => { if (e.target === box) box.close(); });

render();
</script>
</body>
</html>
